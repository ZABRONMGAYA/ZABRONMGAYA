name: engine

on:
  push:
    paths: ["engine/**", ".github/workflows/engine-ci.yml", ".github/scripts/install-ffmpeg.sh"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine-ci.yml", ".github/scripts/install-ffmpeg.sh"]
  schedule:
    - cron: "17 3 * * *" # nightly: include the slow suite

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install FFmpeg
        shell: bash
        run: '"$GITHUB_WORKSPACE/.github/scripts/install-ffmpeg.sh"'
      - run: python -m pip install -e ".[dev]"
      - name: Restore the AI models
        uses: actions/cache@v4
        with:
          path: engine/models
          key: models-dev-${{ hashFiles('engine/src/mcsync/ai/models.py') }}
      - name: Fetch the AI models (transcription and AI sync tests)
        run: python scripts/fetch_models.py
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m pytest -m "not slow"
      - if: github.event_name == 'schedule' && matrix.os == 'ubuntu-latest'
        run: python -m pytest -m slow
