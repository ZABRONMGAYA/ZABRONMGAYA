name: release

# Builds the Syncora installers on each platform: Windows x64 (NSIS), macOS Apple Silicon and Intel (DMG).
# Every installer is tested before upload, the way a user gets the app: install it (silent NSIS install / copy
# from the DMG to /Applications), run the end-to-end suites against the installed app with its bundled engine,
# FFmpeg and AI models (the editor workflow, transcription and AI sync, a 279-file production, and the multicamera
# preview's acceptance test, with 64 matchers requested on Windows), uninstall and check nothing is left behind,
# then install again and launch. Tags (v*) and manual runs also collect the installers into a draft GitHub release.
#
# Optional signing (repository secrets): CSC_LINK + CSC_KEY_PASSWORD (a .p12 Developer ID or Windows code-signing
# certificate, base64), and for macOS notarization APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID.
# Without them, macOS builds are ad-hoc signed and Windows builds are unsigned.

on:
  push:
    tags: ["v*"] # tags build and release whatever changed
    branches: ["**"] # branches build only when packaging changes
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/install-ffmpeg.sh"
      - "engine/packaging/**"
      - "engine/src/mcsync/ai/models.py"
      - "app/electron-builder.yml"
      - "app/scripts/installed-app.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # --- FFmpeg: one pinned, decode-only LGPL build (engine/packaging/build_ffmpeg.sh), cached per recipe
      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: engine/dist/ffmpeg
          key: ffmpeg-${{ matrix.name }}-${{ hashFiles('engine/packaging/build_ffmpeg.sh') }}
      - name: Set up MSYS2 (Windows FFmpeg build)
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-zlib
      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: engine/packaging/build_ffmpeg.sh engine/dist/ffmpeg
      - name: Build FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          brew install nasm
          engine/packaging/build_ffmpeg.sh engine/dist/ffmpeg
      - name: Save FFmpeg (even if a later step fails)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: engine/dist/ffmpeg
          key: ffmpeg-${{ matrix.name }}-${{ hashFiles('engine/packaging/build_ffmpeg.sh') }}

      # --- engine: frozen with PyInstaller, with the AI models it ships (cached: about 200 MB from GitHub releases)
      - name: Restore the AI models
        uses: actions/cache@v4
        with:
          path: engine/dist/models
          key: models-${{ hashFiles('engine/src/mcsync/ai/models.py') }}
      - name: Build the engine
        shell: bash
        env:
          PYTHON: python
        run: engine/packaging/build_engine.sh

      # --- app and installer
      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Build the installer
        working-directory: app
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
            npx electron-builder --win nsis --x64 --publish never
          else
            if [ -n "$CSC_LINK" ]; then
              npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
            else
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              npx electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.mac.identity=-
            fi
          fi
          ls -la release

      # --- test the packaged app before shipping it
      - name: Install FFmpeg with encoders (to generate test footage)
        shell: bash
        run: '"$GITHUB_WORKSPACE/.github/scripts/install-ffmpeg.sh"'
      - name: Install the app (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: ./scripts/installed-app.ps1 install
      - name: Install the app (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: scripts/installed-app.sh install ${{ matrix.arch }}
      - name: End-to-end tests against the installed app
        working-directory: app
        shell: bash
        env:
          MCSYNC_PYTHON: python
        run: |
          echo "Testing $MCSYNC_E2E_APP"
          npx playwright test e2e/app.spec.ts e2e/analyze.spec.ts e2e/production.spec.ts e2e/multicam.spec.ts
      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: ./scripts/installed-app.ps1 uninstall
      - name: Uninstall (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: scripts/installed-app.sh uninstall
      - name: Reinstall (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: ./scripts/installed-app.ps1 install
      - name: Reinstall (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: scripts/installed-app.sh install ${{ matrix.arch }}
      - name: Launch the reinstalled app
        working-directory: app
        shell: bash
        env:
          MCSYNC_PYTHON: python
        run: npx playwright test e2e/app.spec.ts -g "starts on the Syncora home screen"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.name }}
          path: app/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            app/release/*.exe
            app/release/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Checksums
        run: |
          cd installers
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$version-build.$GITHUB_RUN_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          # This version's section of CHANGELOG.md, with its headings one level down.
          awk -v v="## $VERSION" \
            '$0 == v { on = 1; next } on && /^## / { exit } on { sub(/^### /, "#### "); print }' CHANGELOG.md |
            # links to files of the repository, as seen from the release page
            sed -E "s#\]\(([A-Za-z0-9_./-]+\.md)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$SHA/\1)#g" > changes.md
          {
            echo "Installers for Syncora $VERSION, built from $SHA. Each one was installed, tested end to end,"
            echo "uninstalled and installed again on its platform before upload."
            echo
            echo "| Computer | File |"
            echo "|---|---|"
            echo "| Windows 10/11 (64-bit) | \`Syncora-Setup-$VERSION.exe\` |"
            echo "| Mac with Apple Silicon (M1 and later) | \`Syncora-$VERSION-macOS-arm64.dmg\` |"
            echo "| Mac with an Intel processor | \`Syncora-$VERSION-macOS-x64.dmg\` |"
            echo
            echo "These builds are not signed with a paid certificate, so the system asks before the first launch:"
            echo "* **Windows:** \"Windows protected your PC\" → **More info** → **Run anyway**."
            echo "* **macOS:** open the DMG and drag Syncora to Applications. The first time it is blocked:"
            echo "  open **System Settings → Privacy & Security**, and click **Open Anyway** next to Syncora."
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            while read -r hash file; do
              size=$(stat -c %s "installers/$file")
              echo "| \`$file\` | $(numfmt --to=iec-i --suffix=B "$size") ($size bytes) | \`$hash\` |"
            done < installers/SHA256SUMS.txt
            if [ -s changes.md ]; then echo; echo "### What's new"; cat changes.md; fi
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Syncora ${{ steps.version.outputs.version }} (${{ steps.version.outputs.tag }})
          files: installers/*
          body_path: release-notes.md
