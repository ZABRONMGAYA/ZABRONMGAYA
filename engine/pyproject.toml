[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcsync-engine"
version = "1.1.1"
description = "Audio and timecode synchronisation engine for multicamera video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    # Speech and voice models on ONNX Runtime (transcription, speakers, speech-based sync): mcsync.ai
    "sherpa-onnx>=1.13.8",
    "certifi>=2024.2",  # model downloads from the frozen app
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # Independent readers of exported timelines (tests only)
    "opentimelineio>=0.17",
    "otio-fcp-adapter>=1.0",
    "otio-fcpx-xml-adapter>=1.0",
]

[project.scripts]
mcsync = "mcsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mcsync.project" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: multi-minute synthetic recordings (deselect with -m 'not slow')",
    "models: needs the bundled AI models (scripts/fetch_models.py); skipped when they are not there",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
