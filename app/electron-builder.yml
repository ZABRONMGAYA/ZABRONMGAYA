# Installers: Windows (NSIS, x64) and macOS (DMG, arm64 and x64), built by .github/workflows/release.yml.
# The engine (PyInstaller, engine/packaging/build_engine.sh) and FFmpeg (engine/packaging/build_ffmpeg.sh) must be
# built first, on the platform and architecture of the installer. Icons: node scripts/render-icons.mjs.
appId: app.syncora.desktop
productName: Syncora
copyright: Copyright © 2026 Syncora contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - "!**/*.map"
  - package.json
extraResources:
  - from: ../engine/dist/mcsync-engine
    to: engine
  - from: ../engine/dist/ffmpeg
    to: ffmpeg
  - from: build/icon.png # the window's icon (title bar and taskbar on Windows)
    to: icon.png
npmRebuild: false
publish: null # no auto-update feed
electronLanguages: [en-US, en-GB, de, fr, es, it, pt-BR, nl, ja, zh-CN]
fileAssociations:
  - ext: syncora
    name: Syncora project
    description: Syncora project
    role: Editor
    icon: syncora-doc

mac:
  target: dmg
  category: public.app-category.video
  icon: build/icon.icns
  # Signed with a Developer ID when CSC_LINK is set; otherwise the release workflow passes -c.mac.identity=-
  # (ad-hoc), which Apple Silicon needs to run the app at all.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "12.0"
dmg:
  artifactName: Syncora-${version}-macOS-${arch}.${ext}
  title: Syncora ${version}
  # Brand Kit 1n: drawn by scripts/render-icons.mjs, with the icons placed on its left cell and dashed target.
  background: build/background.png
  iconSize: 128
  contents:
    - { x: 155, y: 230, type: file }
    - { x: 505, y: 230, type: link, path: /Applications }

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Syncora
  artifactName: Syncora-Setup-${version}.${ext}
  uninstallDisplayName: Syncora
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Brand Kit 1o: the setup wizard's sidebar (scripts/render-icons.mjs).
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
